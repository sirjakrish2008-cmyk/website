<!DOCTYPE html>
<html>
<head>
<title>Place Your Order</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #222;
	
}
header {
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}
nav {
   background: orange;
   padding: 15px;
   text-align: center;
}
nav a {
    color: black;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    margin: 15px;
}
nav a:hover {
    color: green;
}

form{
    background: #222;
    color: white;
	border-color:black;
 
	text-align:center;
}
form h1{
	color: orange;
}
h1 {
    text-align: center;
}
input, select, textarea {
    padding: 10px;
    margin: 8px;
}
button {
    background: orange;
    padding: 10px 20px;
    border: none;
}
footer{
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

 button {
    background-color: orange;
    color: black;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
        }

        button:hover {
            background-color: black;
            color: white;
        }
		@media(max-width:400px){
            .lights{
                grid-template-columns:1fr;
            }
        }
        @media(min-width:600px){
            .lights{
                grid-template-columns: repeat(2,1fr);
            }
        }
        @media(min-width:900px){
            .lights{
                grid-template-columns: repeat(3,1fr);
            }
        }
</style>
</head>
<body>

<header>
<h1>Bright Light House</h1>
<p>Place Your Order</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="Light.html">Lights</a>
<a href="Order.html">Order</a>
<a href="About.html">About</a>
<a href="Contact.html">Contact</a>
</nav>

<form>
<h1>Place Your Order</h1>

<label>Name:</label>
<input type="text" placeholder="Enter your name" required>
<br>

<label>Email:</label>
<input type="email" placeholder="Enter email" required>
<br>

<label>Phone:</label>
<input type="tel" placeholder="Enter phone number">
<br>

<label>Address:</label>
<input type="Address" placeholder="Enter Your Address">
<br>

<label>Product:</label>
<select>
<option>Select Your Product</option>
<option>LED Light</option>
<option>Decoration Light</option>
<option>Ceiling Light</option>
<option>Fancy Light</option>
<option>Tube Light</option>
<option>Wall Light</option>
</select>
<br>

<label>Quantity:</label>
<input type="number" min="1" max="30">
<br><br>

<button type="submit">Submit Order</button>
<button type="reset">Clear</button>
<br>
<br>
</form>

<footer>
<p>© 2026 Bright Light House</p>
</footer>

</body>
</html>
